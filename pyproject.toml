[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-meteorology"
dynamic = ["version"]
description = "Approved coastal ERA5 hourly and daily weather"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{name = "MarineCast contributors"}]
keywords = ["meteorology", "ERA5", "H3", "geospatial", "environmental modeling", "reproducible science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "h3>=4", "numpy>=1.26", "numcodecs>=0.12,<0.18", "pandas>=2.1",
  "pyarrow>=14", "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "pymdown-extensions>=10.2,<12.2"]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2", "twine>=5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "pymdown-extensions>=10.2,<12.2"]

[project.urls]
Documentation = "https://marinecast.github.io/toolkit-meteorology/"
Repository = "https://github.com/MarineCast/toolkit-meteorology"
Issues = "https://github.com/MarineCast/toolkit-meteorology/issues"

[project.scripts]
meteorology = "meteorology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "meteorology._version.__version__"}

[tool.setuptools.package-data]
meteorology = ["resources/**/*", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
