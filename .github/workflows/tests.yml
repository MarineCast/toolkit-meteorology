name: Offline package checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: |
          cd /tmp
          meteorology --workspace /tmp/weather-smoke init
          meteorology --workspace /tmp/weather-smoke stages
