name: Offline package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    name: ${{ matrix.os == 'ubuntu-24.04' && format('tests ({0})', matrix.python) || format('tests ({0}, {1})', matrix.os, matrix.python) }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: macos-15
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: mkdocs build --strict
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/meteorology-wheel
          /tmp/meteorology-wheel/bin/python -m pip install dist/*.whl pytest
          cp -R tests /tmp/meteorology_wheel_tests
          touch /tmp/meteorology_wheel_tests/__init__.py
          cd /tmp
          /tmp/meteorology-wheel/bin/python -m pytest -q --import-mode=importlib /tmp/meteorology_wheel_tests
          /tmp/meteorology-wheel/bin/meteorology --help
          /tmp/meteorology-wheel/bin/python -m pip check
