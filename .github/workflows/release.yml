name: Versioned software release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Confirm exact semantic version tag
        run: |
          version=$(python -c "import pathlib, re; source = pathlib.Path('src/meteorology/_version.py').read_text(); print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', source).group(1))")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
      - run: python -m pip install '.[dev,native-pilot]'
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: meteorology catalog --check
      - run: meteorology feature-policy --check
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install built wheel outside checkout
        run: |
          python -m venv /tmp/meteorology-wheel
          /tmp/meteorology-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/meteorology-wheel/bin/python -c 'import importlib.metadata, meteorology; assert meteorology.__version__ == importlib.metadata.version("toolkit-meteorology")'
          /tmp/meteorology-wheel/bin/meteorology --help
          /tmp/meteorology-wheel/bin/meteorology --workspace /tmp/meteorology-release-smoke init
          /tmp/meteorology-wheel/bin/meteorology --workspace /tmp/meteorology-release-smoke example-offline
          /tmp/meteorology-wheel/bin/meteorology --workspace /tmp/meteorology-release-smoke validate --daily-matrix /tmp/meteorology-release-smoke/outputs/synthetic-daily-matrix.parquet
          /tmp/meteorology-wheel/bin/python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: [build, github-release]
    if: vars.METEOROLOGY_PYPI_TRUSTED_PUBLISHING == 'enabled'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/toolkit-meteorology/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
