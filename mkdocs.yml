site_name: Meteorology Toolkit
site_description: Approved coastal ERA5 weather with a small Python API and reproducible checks
site_url: https://marinecast.github.io/toolkit-meteorology/
repo_url: https://github.com/MarineCast/toolkit-meteorology
repo_name: MarineCast/toolkit-meteorology
copyright: Apache-2.0 · MarineCast contributors
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - API and usage: regional-api.md
  - Current product: coastal-product.md
  - Contract: CONTRACTS.md
  - Architecture: ARCHITECTURE.md
  - Development: DEVELOPMENT.md
  - Migration: MIGRATION.md
  - Cleanup inventory: cleanup.md
  - Changelog: changelog.md
